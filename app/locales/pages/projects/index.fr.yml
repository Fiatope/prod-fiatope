            content: "Notre aptitude à sélectionner pour vous des projets ambitieux, originaux et innovants dans des domaines tels que l'enseignement supérieur, la santé, les technologies, l'environnement, l'agriculture, la culture. Nous travaillons pour cela avec de nombreux partenaires en Europe et en Afrique."
          trans: 
