            title: 'Fiabilité'
            content: "Vous avez l'assurance que vos dons seront reçus par le porteur de projet bénéficiare. En effet la Banque de France encadre strictement l'activité de détention de fonds pour le compte de tiers et garantit la destination des fonds via l'agrément qu'elle donne à notre intermédiaire de paiement et les obligations légales de Fiatope."
