            content: "Fiatope est une entreprise responsable. Nous travaillons avec des partenaires agréés par les autorités administratives et financières françaises et internationales. Nous mettons tout en oeuvre pour garantir la sécurité de vos informations et des fonds que vous nous confiez pour des tiers."
